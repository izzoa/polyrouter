name: CI

# Enforces the CLAUDE.md Definition of done on every push and pull request:
# build, lint, typecheck (test files included), unit suites, and the e2e suite
# against real Postgres 16 + Redis 7. See openspec/specs/ci-pipeline.
#
# CI-hygiene note: GitHub honours the `[skip ci]` token ANYWHERE in a commit
# message — subject OR body. Two real incidents came from that: a hardening commit
# that skipped CI hid a broken installer test until the next release ran it, and
# the commit fixing that test skipped its own CI merely for QUOTING the token while
# explaining the first. Never let the literal token appear in a message you want
# built; write it as "skip-ci" in prose.
on:
  push:
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: build · lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Present so the REDIS_URL-gated breaker parity suite EXECUTES here (and
      # fails loudly if it can't) rather than silently skipping.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: 'true'
      REDIS_URL: redis://127.0.0.1:6379
      # add-semantic-embedder (impl-clink Med-4): the ORT devDependency's
      # postinstall fetches CUDA blobs on linux-x64 — skip it regardless of
      # npm version/allowScripts posture (CPU prebuilts ship in the tarball).
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Responsive layout is only provable in a real browser — happy-dom performs no
      # layout, so the vitest suites can assert declarations and nothing more. Without
      # this step the dashboard-core requirement that "an automated check fails" when a
      # control ships undersized, or a page overflows, is simply not enforced anywhere.
      # Chromium only: the assertions are geometry, not engine-specific behaviour.
      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: packages/frontend
      - name: responsive browser suite
        run: npm run test:browser
        working-directory: packages/frontend
      # Geometry CAPTURE (assert-browser-geometry-structurally task 4.1). Reports
      # every surface's measured box on this runner; asserts nothing about the
      # values and cannot fail on them. Eleven overlay surfaces have never been
      # measured on Linux -- they pass INSIDE `LINE_SLACK = 40`, and the gating
      # step above reports only failures, so a passing surface discloses nothing.
      # A pass is not a measurement, and narrowing those allowances without this
      # log would be inference. `continue-on-error` is belt and braces: a capture
      # that can turn the build red is a baseline, and pinning fresh numbers from
      # the runner is how the v0.12.0 failure happened.
      - name: geometry capture (reports, never gates)
        run: npm run test:browser:capture
        working-directory: packages/frontend
        continue-on-error: true
      - name: install.sh re-run idempotency (E13)
        run: sh test/install-rerun.test.sh

  e2e:
    name: e2e (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        # Credentials match docker-compose.dev.yml so the config defaults connect.
        env:
          POSTGRES_USER: polyrouter
          POSTGRES_PASSWORD: polyrouter
          POSTGRES_DB: polyrouter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polyrouter -d polyrouter"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://polyrouter:polyrouter@127.0.0.1:5432/polyrouter
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build the workspace deps once (turbo-cached); every e2e process reuses it.
      - run: npm run build
      # `test:e2e` splits itself: the bulk of the suites in one jest process, then
      # auth.e2e and user-admin.e2e each in their OWN process. They cannot share one.
      # Better Auth is ESM-only (no CJS build), so loading it needs Node's native
      # dynamic import, which is why this run sets --experimental-vm-modules. Under
      # that flag jest caches an imported ESM module across test FILES but binds it to
      # the VM context of whichever file imported it first; that context dies with the
      # file, so the SECOND of the two to build an auth app imports into a dead realm
      # and throws `... after the Jest environment has been torn down` from inside
      # jest-runtime — surfacing as the `undefined … 'identifier'`/`'close'` errors.
      #
      # The previous workaround isolated the two auth suites as a GROUP, which cannot
      # work: they still shared a process, so the second failed every time (8/8 when
      # run as a pair; 17 and 8 pass when run apart). That is why this read as
      # deterministic in CI and merely intermittent locally, where jest's cached-suite
      # ordering changes which file owns the realm. The retry could not help either —
      # it re-ran the same losing order.
      - name: e2e (auth suites isolated per file by the runner)
        run: |
          if ! npm run test:e2e -w packages/control-plane; then
            echo "::warning title=e2e retried::e2e failed; re-running once on a fresh process"
            npm run test:e2e -w packages/control-plane
          fi

  baseline-image-neutrality:
    # add-semantic-embedder D7: the optional semantic stack must NEVER reach
    # the baseline image — no onnxruntime artifact, no model/vocab files.
    # (An optional PEER dependency is never auto-installed; this proves it.)
    name: baseline image stays ORT- and model-free
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (baseline)
        run: docker build -t polyrouter-baseline:ci .
      - name: Assert no ONNX runtime or model artifacts exist in the image
        run: |
          docker run --rm --entrypoint sh polyrouter-baseline:ci -c '
            set -e
            fail=0
            pkgs=$(find /app -type d -name "onnxruntime*" | head -20)
            if [ -n "$pkgs" ]; then echo "FORBIDDEN runtime packages:"; echo "$pkgs"; fail=1; fi
            models=$(find /app -name "*.onnx" -o -name "*.ort" | head -20)
            if [ -n "$models" ]; then echo "FORBIDDEN model files:"; echo "$models"; fail=1; fi
            if [ -d /app/models ]; then echo "FORBIDDEN baked model directory /app/models"; fail=1; fi
            [ "$fail" = 0 ] || exit 1
            echo "baseline image is ORT- and model-free"'
