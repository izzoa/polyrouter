<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>polyrouter</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Geist bundled locally (#22): the packaged SPA makes no third-party fetches. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- Pre-paint theme (adopt-design-tokens-v2 D9). A classic script in <head>, like the
         boot guard below: it runs before the body is parsed, so the first frame is already in
         the resolved theme and a dark system never flashes light. A stored choice wins; with
         none — or with storage that throws — the system preference decides. The app reads
         the attribute this sets (`appState.theme`) and keeps following the preference until
         the user picks a theme. The storage key is the one the theme toggle writes. -->
    <script data-prepaint-theme>
      (function () {
        var theme = null;
        try {
          var stored = window.localStorage.getItem('polyrouter-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        } catch (e) {
          // storage unavailable: follow the system preference
        }
        if (theme === null) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot-failure guard (fix-nonstandard-locale-boot-crash).
         A classic script, deliberately: `type="module"` is deferred, so this runs first and —
         more importantly — lives OUTSIDE the module graph. A failure during module evaluation
         stops everything inside that graph, so no framework error boundary can report it.
         Without this the user gets a white page, which reads as a crashed server or a bad
         deploy and sends them to their proxy logs instead of here.
         The message is a fixed string: a thrown value can carry anything that was in scope
         where it was raised, so it is never displayed, logged, transmitted or persisted. -->
    <script>
      (function () {
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            // The app mounts synchronously during module evaluation, so an empty #root at
            // this point means it never started — whatever the cause.
            if (!root || root.childElementCount > 0) return;
            // Theme-aware (adopt-design-tokens-v2 D9): the pre-paint script can put a failed
            // boot on the dark canvas, so the box draws its own background and reads the
            // theme's tokens. Each fallback is the light literal, so without the stylesheet
            // the pair is still one theme's: the light text on the light box.
            var box = document.createElement('div');
            box.setAttribute('role', 'alert');
            box.style.cssText =
              'font:400 0.8125rem/1.25rem Geist,sans-serif;max-width:34rem;margin:15vh auto;padding:0 1.5rem;background:var(--bg, #fafafa);color:var(--text2, #55575e)';
            var h = document.createElement('div');
            h.style.cssText =
              'font-weight:600;font-size:0.9375rem;margin-bottom:.5rem;color:var(--text, #17181a)';
            h.textContent = 'The polyrouter dashboard failed to start.';
            var p = document.createElement('p');
            p.style.cssText = 'margin:0';
            p.textContent =
              'The server is reachable — this is a failure in the dashboard itself, so ' +
              'checking your proxy or container logs will not explain it. Reload to retry. ' +
              'If it persists, your browser reports details in its developer console.';
            box.appendChild(h);
            box.appendChild(p);
            root.appendChild(box);
          }, 0);
        });
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
